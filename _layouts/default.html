<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="color-scheme" content="light">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">SailPoint ISC <span>Theory</span></a>
      <span class="edition">Working edition</span>
    </header>
    <div class="site-shell">
      <aside class="course-sidebar" aria-label="Course navigation">
        <details class="course-navigation" open>
          <summary>Lessons</summary>
          {% include lesson-list.html %}
        </details>
        <script>
          if (window.matchMedia("(max-width: 56rem)").matches) {
            document.querySelector(".course-navigation").open = false;
          }
        </script>
      </aside>
      <main id="main" tabindex="-1">
        {{ content }}
      </main>
    </div>
    <footer class="site-footer">
      <p>Independent learning material. This course is in development.</p>
      <a href="https://github.com/{{ site.repository }}">Course repository</a>
    </footer>
  </body>
</html>
